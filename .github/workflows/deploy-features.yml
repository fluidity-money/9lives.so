name: Deploy features

on:
  push:
    branches:
      - main
    paths:
      - 'features/**'

jobs:
  deploy-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Test the JSON is well-formed
        uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: 'jq . features/features.json >/dev/null'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ secrets.CLOUDFLARE_FEATURES_PROJECT_NAME }} --branch=main
          workingDirectory: features
